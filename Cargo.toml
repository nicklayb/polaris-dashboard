[workspace]
resolver = "3"
members = ["crates/polaris-core", "crates/polaris-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
polaris-core = { path = "crates/polaris-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
humantime-serde = "1"
thiserror = "2"
jiff = "0.2"
ureq = { version = "3", features = ["json", "platform-verifier"] }
ratatui = "0.30"
crossterm = "0.29"

[profile.release]
lto = true
codegen-units = 1
strip = true
